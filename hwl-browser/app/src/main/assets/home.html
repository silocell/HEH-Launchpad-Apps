<!doctype html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>HWL Search</title>
<style>
:root{--ink:#1d2433;--soft:#5b6478;--line:#e3e6ef;--blue:#3b6cf0;--green:#16a34a;--card:#f4f6fb}
*{box-sizing:border-box}
body{margin:0;font:16px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;color:var(--ink);background:#fff}
.home{max-width:560px;margin:0 auto;padding:56px 18px 30px;text-align:center}
.logo{width:72px;height:72px;border-radius:20px;background:linear-gradient(135deg,#ff8a3d,#d9408f);display:grid;place-items:center;margin:0 auto 10px}
h1{font-size:30px;margin:6px 0 18px;letter-spacing:-.02em}
form{display:flex;gap:8px}
input[type=search]{flex:1;min-width:0;height:48px;border-radius:999px;border:1px solid var(--line);background:var(--card);padding:0 18px;font-size:16px;color:var(--ink);outline:0}
input[type=search]:focus{border-color:var(--blue)}
button,.aim{height:48px;padding:0 18px;border:0;border-radius:999px;background:var(--blue);color:#fff;font-weight:700;font-size:15px}
.aim{display:inline-flex;align-items:center;gap:6px;text-decoration:none;color:#fff;font-weight:700;font-size:15px;border-radius:999px;padding:0 18px;background:linear-gradient(135deg,#3b6cf0,#9b4de0)}
.opt{margin:12px 0 0;font-size:14px;color:var(--soft)}
.quick{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:28px}
.quick a{display:flex;flex-direction:column;align-items:center;gap:6px;padding:12px 4px;border-radius:14px;color:var(--ink);text-decoration:none;font-size:13px}
.quick a:active{background:var(--card)}
.quick i{font-style:normal;font-size:24px;width:48px;height:48px;border-radius:14px;display:grid;place-items:center;background:var(--card)}
.note{margin-top:26px;font-size:12px;color:#9aa1b5}
.res{max-width:720px;margin:0 auto;padding:14px 16px 40px}
.hd{color:var(--soft);font-size:14px;margin:4px 0 10px}
.sec{font-weight:700;font-size:15px;margin:18px 0 4px}
.res a{display:block;padding:10px 4px;border-bottom:1px solid var(--line);color:inherit;text-decoration:none}
.res b{display:block;color:var(--blue);font-size:17px;font-weight:600}
.res small{display:block;color:var(--green);font-size:12px;margin:2px 0 3px;word-break:break-all}
.res a.aim{display:inline-flex;height:38px;margin:0 0 10px;border:0;padding:0 16px}
.res span{color:var(--soft);font-size:14px}
</style>
</head>
<body>
<main id="app"></main>
<script>
var QUICK = [["📖", "Wikipedia", "https://en.m.wikipedia.org/wiki/Main_Page"], ["🧒", "Kiddle", "https://kids.kiddle.co/"],
  ["🎓", "Bitesize", "https://www.bbc.co.uk/bitesize"], ["🚀", "Launchpad", "https://civilinitiatives.org/"],
  ["🤖", "Chatbot R", "https://games.civilinitiatives.org/chatbot-r/"], ["🎮", "Games", "https://games.civilinitiatives.org/"]];
var simple = false; try { simple = localStorage.getItem("simple") === "1"; } catch (e) {}
function esc(t) { return String(t).replace(/[&<>"]/g, function (c) { return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]; }); }
function strip(h) { var d = document.createElement("div"); d.innerHTML = String(h || ""); return d.textContent; }
var app = document.getElementById("app");
function q() { var h = location.hash; return h.indexOf("#q=") === 0 ? decodeURIComponent(h.slice(3)) : ""; }
function aiUrl(t) { return "https://hwlai.civilinitiatives.org/" + (t ? "#q=" + encodeURIComponent(t.slice(0, 500)) : ""); }
function search(text) { location.hash = "q=" + encodeURIComponent(text); }
function home() {
  app.innerHTML = '<div class="home"><div class="logo"><svg width="40" height="40" viewBox="0 0 40 40" fill="none" stroke="#fff" stroke-width="3.4" stroke-linecap="round"><path d="M12 9v22M28 9v22M12 20h16"/></svg></div>' +
    '<h1>HWL Search</h1><form><input type="search" placeholder="What do you want to find out?" aria-label="Search" enterkeyhint="search"><button>Search</button></form>' +
    '<p style="margin:12px 0 0"><a class="aim" id="aim" href="' + aiUrl("") + '">✨ AI Mode</a></p>' +
    '<p class="opt"><label><input type="checkbox"' + (simple ? " checked" : "") + '> Simple English Wikipedia (easier to read)</label></p>' +
    '<div class="quick">' + QUICK.map(function (x) { return '<a href="' + x[2] + '"><i>' + x[0] + "</i>" + esc(x[1]) + "</a>"; }).join("") + "</div>" +
    '<p class="note">Every website is checked to make sure it\'s OK for school before it opens.</p></div>';
  var box = app.querySelector("input[type=search]");
  app.querySelector("#aim").onclick = function (e) { var t = box.value.trim(); if (t) { e.preventDefault(); location.href = aiUrl(t); } };
  app.querySelector("form").onsubmit = function (e) { e.preventDefault(); if (box.value.trim()) search(box.value.trim()); };
  app.querySelector(".opt input").onchange = function () { simple = this.checked; try { localStorage.setItem("simple", simple ? "1" : "0"); } catch (e) {} };
}
function results(text) {
  var host = simple ? "simple" : "en";
  app.innerHTML = '<div class="res"><a class="aim" href="' + esc(aiUrl(text)) + '">✨ Ask HWLAI (AI Mode)</a><p class="hd">Searching for “' + esc(text) + '”…</p><div class="web"></div><div class="vid"></div><div class="wiki"></div></div>';
  var box = app.querySelector(".res"), found = 0, done = 0;
  function finish() { if (++done < 3) return; box.querySelector(".hd").textContent = found ? "Results for “" + text + "”" : "Nothing found for “" + text + "”. Try different words."; }
  function sec(cls, name) { var s = box.querySelector("." + cls); s.innerHTML = '<p class="sec">' + name + "</p>"; return s; }
  function hit(s, title, url, shown, about) { found++; var a = document.createElement("a"); a.href = url;
    a.innerHTML = "<b>" + esc(title) + "</b><small>" + esc(shown) + "</small><span>" + esc(about) + "</span>"; s.appendChild(a); }
  fetch("https://hehs-live.duckdns.org/search/v1?query=" + encodeURIComponent(text) + "&maximumRecords=10").then(function (r) { return r.json(); }).then(function (j) {
    var items = ((j.channels || [])[0] || {}).items || [];
    if (items.length) { var s = sec("web", "HWL Search"); items.forEach(function (it) { var sh = it.link.replace(/^https?:\/\//, "").slice(0, 70); hit(s, strip(it.title) || sh, it.link, sh, strip(it.description).slice(0, 200)); }); }
  }).catch(function () {}).then(finish);
  fetch("https://chausima.com/ctube/feed.json").then(function (r) { return r.json(); }).then(function (f) {
    var words = text.toLowerCase().split(/\s+/).filter(function (w) { return w.length > 2; }), ch = {};
    (f.channels || []).forEach(function (c) { ch[c.id] = c.name; });
    var vids = (f.videos || []).map(function (v) { var t = (v.t + " " + v.d).toLowerCase(), sc = 0; words.forEach(function (w) { if (t.indexOf(w) >= 0) sc += v.t.toLowerCase().indexOf(w) >= 0 ? 3 : 1; }); return [sc, v]; })
      .filter(function (x) { return x[0] > 0; }).sort(function (a, b) { return b[0] - a[0]; }).slice(0, 4);
    if (vids.length) { var s = sec("vid", "Videos"); vids.forEach(function (x) { var v = x[1]; hit(s, "▶ " + v.t, "https://www.youtube-nocookie.com/embed/" + v.id, (ch[v.c] || "YouTube") + " · YouTube", (v.d || "").slice(0, 140)); }); }
  }).catch(function () {}).then(finish);
  fetch("https://" + host + ".wikipedia.org/w/api.php?action=query&list=search&format=json&origin=*&srlimit=8&srsearch=" + encodeURIComponent(text)).then(function (r) { return r.json(); }).then(function (j) {
    var hits = (j.query && j.query.search) || [];
    if (hits.length) { var s = sec("wiki", (simple ? "Simple English " : "") + "Wikipedia"); hits.forEach(function (h) {
      hit(s, h.title, "https://" + host + ".m.wikipedia.org/wiki/" + encodeURIComponent(h.title.replace(/ /g, "_")), host + ".wikipedia.org/wiki/" + h.title.replace(/ /g, "_"), strip(h.snippet) + "…"); }); }
  }).catch(function () {}).then(finish);
}
function route() { var t = q(); if (t) results(t); else home(); window.scrollTo(0, 0); }
window.addEventListener("hashchange", route); route();
</script>
</body>
</html>
