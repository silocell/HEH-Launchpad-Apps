name: Build apps
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  apple:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Tools
        run: brew install xcodegen
      - name: Project
        working-directory: ios
        run: xcodegen generate
      - name: iPhone / iPad (unsigned IPA)
        working-directory: ios
        run: |
          set -o pipefail
          mkdir -p ../out ../logs
          xcodebuild -project HomeworkLaunchpad.xcodeproj -scheme HomeworkLaunchpad -configuration Release \
            -sdk iphoneos -destination 'generic/platform=iOS' -derivedDataPath dd-ios \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" build 2>&1 | tee ../logs/ios.log | tail -40 || { grep -E "error:" ../logs/ios.log | sort -u | head -25 | sed "s/^/::error::/"; exit 1; }
          APP=$(find dd-ios/Build/Products -name "HomeworkLaunchpad.app" -maxdepth 3 | head -1)
          mkdir -p Payload && cp -R "$APP" Payload/
          zip -qry ../out/HomeworkLaunchpad.ipa Payload
      - name: Mac (Catalyst, ad-hoc signed DMG)
        if: always()
        working-directory: ios
        run: |
          set -o pipefail
          mkdir -p ../out ../logs
          xcodebuild -project HomeworkLaunchpad.xcodeproj -scheme HomeworkLaunchpad -configuration Release \
            -destination 'generic/platform=macOS,variant=Mac Catalyst' -derivedDataPath dd-mac \
            ONLY_ACTIVE_ARCH=NO CODE_SIGN_IDENTITY="-" CODE_SIGN_STYLE=Manual DEVELOPMENT_TEAM="" build 2>&1 | tee ../logs/mac.log | tail -40 || { grep -E "error:" ../logs/mac.log | sort -u | head -25 | sed "s/^/::error::/"; exit 1; }
          APP=$(find dd-mac/Build/Products -name "HomeworkLaunchpad.app" -maxdepth 3 | head -1)
          mkdir -p dmg && cp -R "$APP" "dmg/Homework Launchpad.app" && ln -s /Applications dmg/Applications
          codesign --force --deep -s - "dmg/Homework Launchpad.app"
          hdiutil create -volname "Homework Launchpad" -srcfolder dmg -ov -format UDZO ../out/HomeworkLaunchpad.dmg
      - uses: actions/upload-artifact@v4
        if: always()
        with: { name: apple, path: "out/\nlogs/", if-no-files-found: ignore }
  linux:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - name: Packages
        run: sudo apt-get update && sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev libfuse2 file
      - name: deb + AppImage
        run: |
          set -o pipefail
          mkdir -p logs
          OUT=$PWD/out sh linux/package.sh 2>&1 | tee logs/linux.log
      - uses: actions/upload-artifact@v4
        if: always()
        with: { name: linux, path: "out/\nlogs/", if-no-files-found: ignore }
  snap:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - name: Snapcraft
        working-directory: linux
        run: |
          sudo snap install snapcraft --classic
          sudo snapcraft --destructive-mode --verbosity=verbose 2>&1 | tail -60 || { echo "::error::snapcraft failed"; exit 1; }
          mkdir -p ../out && cp *.snap ../out/homework-launchpad_2.0_amd64.snap
      - name: Snap logs
        if: failure()
        run: mkdir -p snaplogs && sudo find / -path /proc -prune -o -name "snapcraft*.log" -print 2>/dev/null | head -5 | while read f; do sudo cp "$f" snaplogs/ ; done; sudo chmod -R a+r snaplogs; ls -la snaplogs
      - uses: actions/upload-artifact@v4
        if: failure()
        with: { name: snaplogs, path: snaplogs/, if-no-files-found: ignore }
      - uses: actions/upload-artifact@v4
        if: always()
        with: { name: snap, path: out/, if-no-files-found: ignore }
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build the EXE
        working-directory: windows
        run: dotnet build -c Release
      - name: Pack the MSIX
        shell: pwsh
        run: |
          New-Item -ItemType Directory out -Force | Out-Null
          ./windows/msix/build-msix.ps1 -Exe "$PWD\windows\bin\Release\net48\HomeworkLaunchpad.exe" -Version "2.1.0.0"
          Copy-Item windows\msix\dist\HomeworkLaunchpad.msix out\
          Copy-Item windows\bin\Release\net48\HomeworkLaunchpad.exe out\HomeworkLaunchpad-ci.exe
      - uses: actions/upload-artifact@v4
        if: always()
        with: { name: windows, path: out/, if-no-files-found: ignore }
  publish:
    needs: [apple, linux, snap, windows]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with: { path: got }
      - name: Push to the builds branch
        run: |
          mkdir pub && cd pub
          git init -q -b builds
          find ../got -type f \( -path "*/out/*" -o -path "*/logs/*" \) -exec cp {} . \;
          find ../got -maxdepth 2 -type f -exec cp {} . \; || true
          echo "Run ${{ github.run_id }} for ${{ github.sha }}: apple=${{ needs.apple.result }} linux=${{ needs.linux.result }} snap=${{ needs.snap.result }} windows=${{ needs.windows.result }}" > STATUS.txt
          ls -la
          git config user.name "build bot"; git config user.email "actions@users.noreply.github.com"
          git add -A && git commit -qm "Builds for ${{ github.sha }}"
          git push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}" builds
